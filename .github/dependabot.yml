version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  # One PR per group instead of one per package: every merged runtime update
  # triggers a release, so bundle them into at most one patch release a month.
  # Major updates are not grouped and still arrive as separate PRs.
  groups:
    runtime:
      dependency-type: production
      update-types: [minor, patch]
    dev:
      dependency-type: development
      update-types: [minor, patch]
  ignore:
    # v10 needs conventional-changelog-writer@9, but
    # @semantic-release/release-notes-generator still ships writer@8.
    # Lift this once the generator moves to writer@9.
    - dependency-name: conventional-changelog-conventionalcommits
      update-types: [version-update:semver-major]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
