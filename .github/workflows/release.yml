name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC for npm trusted publishing (and provenance)

jobs:
  release:
    # Avoid running semantic-release on its own version-bump commit
    if: github.repository == 'california444/homebridge-doorbell-telegram-photo' && !contains(github.event.head_commit.message, 'chore(release):')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24, not 22: npm trusted publishing needs npm >= 11.5.1 and
      # Node 22 still bundles npm 10.x.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      # Fail before the tag and the GitHub release exist, not inside
      # `npm publish`'s prepublishOnly hook.
      - name: Build the project
        run: npm run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
